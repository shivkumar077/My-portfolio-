<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- 3D Shadow Gradient for Planet Sphere -->
    <radialGradient id="sphereShade" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#db9fc6" />
      <stop offset="55%" stop-color="#c98fb4" />
      <stop offset="100%" stop-color="#8d5f7f" />
    </radialGradient>
    <clipPath id="planetClip">
      <circle cx="32" cy="32" r="20" />
    </clipPath>
  </defs>

  <!-- Back of Saturn Ring -->
  <g transform="rotate(-18 32 32)">
    <ellipse cx="32" cy="32" rx="31" ry="8.5" fill="none" stroke="#e2c6d8" stroke-width="4.2" opacity="0.95" />
  </g>

  <!-- Planet Body -->
  <circle cx="32" cy="32" r="20" fill="url(#sphereShade)" />

  <!-- Front of Saturn Ring (Clipped over body bottom) -->
  <g clip-path="url(#planetClip)">
    <g transform="rotate(-18 32 32)">
      <!-- Front ring arc -->
      <path d="M 1 32 A 31 8.5 0 0 0 63 32" fill="none" stroke="#e2c6d8" stroke-width="4.2" opacity="0.95" />
    </g>
  </g>

  <!-- Sunglasses -->
  <g transform="translate(32, 28) rotate(-4)">
    <!-- Left Lens -->
    <rect x="-15" y="-4" width="13" height="8" rx="2.5" fill="#150a26" />
    <!-- Right Lens -->
    <rect x="2" y="-4" width="13" height="8" rx="2.5" fill="#150a26" />
    <!-- Center Bridge -->
    <line x1="-2" y1="-0.5" x2="2" y2="-0.5" stroke="#150a26" stroke-width="2.2" stroke-linecap="round" />
    <!-- Specular Glint Left -->
    <circle cx="-10.5" cy="-1.5" r="1.3" fill="#ffffff" opacity="0.9" />
    <!-- Specular Glint Right -->
    <circle cx="6.5" cy="-1.5" r="1.3" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- Smirk Mouth -->
  <path d="M 28 40 Q 33 44 38 40" fill="none" stroke="#150a26" stroke-width="2.2" stroke-linecap="round" />
</svg>
